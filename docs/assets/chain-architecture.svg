<text x="292" y="170" text-anchor="middle" fill="#66738f" font-size="9.5" font-weight="400">HTTP/2 :8080</text>
<rect x="200" y="182" width="184" height="44" rx="10" fill="#0f1830" stroke="rgba(79,140,255,.55)" stroke-width="1"/>
<text x="292" y="200" text-anchor="middle" fill="#e6ecf7" font-size="11.5" font-weight="600">ext_proc HTTP filter</text>
<text x="292" y="216" text-anchor="middle" fill="#66738f" font-size="8.5" font-weight="400">6 phases · request/response</text>
<rect x="204" y="238" width="84" height="22" rx="5" fill="#0b1020" stroke="rgba(120,150,220,.32)" stroke-width="1"/>
<text x="246" y="253" text-anchor="middle" fill="#93a0bd" font-size="8.5" font-weight="400">req headers</text>
