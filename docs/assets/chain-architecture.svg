<rect x="296" y="266" width="84" height="22" rx="5" fill="#0b1020" stroke="rgba(120,150,220,.32)" stroke-width="1"/>
<text x="338" y="281" text-anchor="middle" fill="#93a0bd" font-size="8.5" font-weight="400">resp body</text>
<rect x="296" y="294" width="84" height="22" rx="5" fill="#0b1020" stroke="rgba(120,150,220,.32)" stroke-width="1"/>
<text x="338" y="309" text-anchor="middle" fill="#93a0bd" font-size="8.5" font-weight="400">resp trailers</text>
<text x="292" y="332" text-anchor="middle" fill="#ff7b72" font-size="8.5" font-weight="400">ImmediateResponse → local reply</text>
<text x="292" y="346" text-anchor="middle" fill="#ff7b72" font-size="8.5" font-weight="400">upstream call is skipped</text>
<line x1="292" y1="380" x2="292" y2="410" stroke="#4f8cff" stroke-width="1.8" marker-end="url(#arrBlue)"/>
<text x="300" y="399" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">route / forward</text>
<rect x="184" y="414" width="216" height="62" rx="10" fill="#0f1830" stroke="rgba(120,150,220,.45)" stroke-width="1"/>
<text x="292" y="440" text-anchor="middle" fill="#e6ecf7" font-size="13.5" font-weight="600">Upstream</text>
<text x="292" y="458" text-anchor="middle" fill="#66738f" font-size="9" font-weight="400">receives mutated headers/body</text>
<line x1="400" y1="228" x2="466" y2="228" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrCyan)"/>
<line x1="466" y1="244" x2="400" y2="244" stroke="#4f8cff" stroke-width="1.8" marker-end="url(#arrBlue)" stroke-dasharray="4 3"/>
<text x="433" y="216" text-anchor="middle" fill="#22d3ee" font-size="8.5" font-weight="400">gRPC</text>
<text x="433" y="260" text-anchor="middle" fill="#66738f" font-size="8.5" font-weight="400">TLS/mTLS</text>
<text x="470" y="112" text-anchor="start" fill="#93a0bd" font-size="13" font-weight="600">② Inside ext-proc</text>
<rect x="470" y="124" width="520" height="702" rx="14" fill="rgba(34,211,238,.035)" stroke="rgba(34,211,238,.5)" stroke-width="1"/>
<text x="490" y="148" text-anchor="start" fill="#e6ecf7" font-size="13" font-weight="600">ext-proc process</text>
<text x="490" y="164" text-anchor="start" fill="#66738f" font-size="8.5" font-weight="400">gRPC data plane · no request state on plugin instances</text>
<rect x="490" y="178" width="480" height="62" rx="10" fill="#0f1830" stroke="rgba(34,211,238,.5)" stroke-width="1"/>
<text x="506" y="200" text-anchor="start" fill="#22d3ee" font-size="12" font-weight="600">gRPC server</text>
<text x="506" y="218" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">TLS/mTLS · MaxRecv/SendMsgSize · concurrent stream cap · health Watch</text>
<line x1="730" y1="240" x2="730" y2="258" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrCyan)"/>
<rect x="490" y="260" width="480" height="64" rx="10" fill="#0f1830" stroke="rgba(120,150,220,.38)" stroke-width="1"/>
<text x="506" y="282" text-anchor="start" fill="#e6ecf7" font-size="11.5" font-weight="600">RequestContext (one per stream)</text>
<text x="506" y="300" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">stream ctx · request_id · traceparent → trace_id/span_id · shared KV</text>
<line x1="730" y1="324" x2="730" y2="342" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrCyan)"/>
<text x="490" y="356" text-anchor="start" fill="#93a0bd" font-size="10.5" font-weight="600">six phase callbacks — the chain runs at every phase</text>
<rect x="490" y="366" width="154" height="23" rx="5" fill="#0b1020" stroke="rgba(34,211,238,.35)" stroke-width="1"/>
<text x="567" y="381" text-anchor="middle" fill="#93a0bd" font-size="8.5" font-weight="400">request headers</text>
<rect x="652" y="366" width="154" height="23" rx="5" fill="#0b1020" stroke="rgba(34,211,238,.35)" stroke-width="1"/>
<text x="729" y="381" text-anchor="middle" fill="#93a0bd" font-size="8.5" font-weight="400">request body</text>
<rect x="814" y="366" width="154" height="23" rx="5" fill="#0b1020" stroke="rgba(34,211,238,.35)" stroke-width="1"/>
<text x="891" y="381" text-anchor="middle" fill="#93a0bd" font-size="8.5" font-weight="400">request trailers</text>
<rect x="490" y="394" width="154" height="23" rx="5" fill="#0b1020" stroke="rgba(34,211,238,.35)" stroke-width="1"/>
<text x="567" y="409" text-anchor="middle" fill="#93a0bd" font-size="8.5" font-weight="400">response headers</text>
<rect x="652" y="394" width="154" height="23" rx="5" fill="#0b1020" stroke="rgba(34,211,238,.35)" stroke-width="1"/>
<text x="729" y="409" text-anchor="middle" fill="#93a0bd" font-size="8.5" font-weight="400">response body</text>
<rect x="814" y="394" width="154" height="23" rx="5" fill="#0b1020" stroke="rgba(34,211,238,.35)" stroke-width="1"/>
<text x="891" y="409" text-anchor="middle" fill="#93a0bd" font-size="8.5" font-weight="400">response trailers</text>
<line x1="600" y1="420" x2="600" y2="440" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrCyan)"/>
<line x1="850" y1="420" x2="850" y2="440" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrCyan)"/>
<rect x="490" y="442" width="220" height="94" rx="10" fill="#0b1020" stroke="rgba(79,140,255,.55)" stroke-width="1"/>
<text x="506" y="464" text-anchor="start" fill="#e6ecf7" font-size="12" font-weight="600">RouteTable</text>
<text x="506" y="481" text-anchor="start" fill="#66738f" font-size="8.5" font-weight="400">immutable generation</text>
<text x="506" y="497" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">first matching matchRule wins</text>
<text x="506" y="513" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">disable / global fallback</text>
<text x="506" y="529" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">one instance per variant</text>
<line x1="710" y1="489" x2="728" y2="489" stroke="#4f8cff" stroke-width="1.8" marker-end="url(#arrBlue)"/>
<rect x="730" y="442" width="240" height="94" rx="10" fill="rgba(34,211,238,.06)" stroke="rgba(34,211,238,.6)" stroke-width="1"/>
<text x="746" y="464" text-anchor="start" fill="#22d3ee" font-size="12" font-weight="600">Chain</text>
<text x="746" y="481" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">order ↑ · short-circuit stops rest</text>
<text x="746" y="497" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">per-plugin failurePolicy</text>
<text x="746" y="513" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">snapshot + rollback on fail_open</text>
<text x="746" y="529" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">metrics observer per invocation</text>
<text x="490" y="558" text-anchor="start" fill="#93a0bd" font-size="10.5" font-weight="600">plugins — immutable instances</text>
<line x1="850" y1="536" x2="850" y2="556" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrCyan)"/>
<rect x="490" y="566" width="150" height="42" rx="8" fill="#0b1020" stroke="#4f8cff" stroke-width="1"/>
<text x="565.0" y="582" text-anchor="middle" fill="#e6ecf7" font-size="10.5" font-weight="600">model-router</text>
<text x="565.0" y="596" text-anchor="middle" fill="#66738f" font-size="8.5" font-weight="400">order 10 · body routing</text>
<rect x="660" y="566" width="150" height="42" rx="8" fill="#0b1020" stroke="#4f8cff" stroke-width="1"/>
<text x="735.0" y="582" text-anchor="middle" fill="#e6ecf7" font-size="10.5" font-weight="600">apikey-extract</text>
<text x="735.0" y="596" text-anchor="middle" fill="#66738f" font-size="8.5" font-weight="400">order 20 · headers</text>
<rect x="830" y="566" width="140" height="42" rx="8" fill="#0b1020" stroke="#66738f" stroke-width="1"/>
<text x="900.0" y="582" text-anchor="middle" fill="#e6ecf7" font-size="10.5" font-weight="600">your-plugin</text>
<text x="900.0" y="596" text-anchor="middle" fill="#66738f" font-size="8.5" font-weight="400">order N</text>
<rect x="490" y="626" width="480" height="74" rx="10" fill="rgba(247,185,85,.04)" stroke="rgba(247,185,85,.55)" stroke-width="1"/>
<text x="506" y="648" text-anchor="start" fill="#f7b955" font-size="11.5" font-weight="600">failure semantics</text>
<text x="506" y="665" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">fail_open → rollback mutations + request state, continue</text>
<text x="506" y="681" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">fail_closed → abort; Envoy failure_mode_allow is still final</text>
<text x="506" y="695" text-anchor="start" fill="#66738f" font-size="8.5" font-weight="400">panic is recovered at the plugin boundary and follows the policy</text>
<rect x="490" y="712" width="480" height="58" rx="10" fill="rgba(61,220,151,.04)" stroke="rgba(61,220,151,.45)" stroke-width="1"/>
<text x="506" y="734" text-anchor="start" fill="#3ddc97" font-size="11.5" font-weight="600">observability</text>
<text x="506" y="751" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">stream + plugin/phase metrics · metadata-only slog · trace_id</text>
<text x="1020" y="112" text-anchor="start" fill="#93a0bd" font-size="13" font-weight="600">③ Generation &amp; operations</text>
<rect x="1020" y="124" width="380" height="260" rx="14" fill="rgba(34,211,238,.03)" stroke="rgba(34,211,238,.5)" stroke-width="1"/>
<text x="1040" y="150" text-anchor="start" fill="#e6ecf7" font-size="13" font-weight="600">generation lifecycle</text>
<rect x="1040" y="166" width="160" height="66" rx="10" fill="#0f1830" stroke="rgba(34,211,238,.55)" stroke-width="1"/>
<text x="1120" y="188" text-anchor="middle" fill="#22d3ee" font-size="11.5" font-weight="600">Generation A</text>
<text x="1120" y="205" text-anchor="middle" fill="#93a0bd" font-size="8.5" font-weight="400">active · refs=3</text>
<text x="1120" y="220" text-anchor="middle" fill="#66738f" font-size="8.5" font-weight="400">serves in-flight streams</text>
<rect x="1220" y="166" width="160" height="66" rx="10" fill="#0f1830" stroke="rgba(120,150,220,.35)" stroke-width="1"/>
<text x="1300" y="188" text-anchor="middle" fill="#e6ecf7" font-size="11.5" font-weight="600">Generation B</text>
<text x="1300" y="205" text-anchor="middle" fill="#93a0bd" font-size="8.5" font-weight="400">next · validated</text>
<text x="1300" y="220" text-anchor="middle" fill="#66738f" font-size="8.5" font-weight="400">serves new requests</text>
<line x1="1220" y1="199" x2="1204" y2="199" stroke="#f7b955" stroke-width="1.8" marker-end="url(#arrAmber)"/>
<text x="1212" y="190" text-anchor="middle" fill="#f7b955" font-size="8" font-weight="400">swap</text>
<text x="1040" y="252" text-anchor="start" fill="#93a0bd" font-size="9" font-weight="400">build → validate → publish atomically</text>
<text x="1040" y="270" text-anchor="start" fill="#93a0bd" font-size="9" font-weight="400">retire A → Close after refs reach 0</text>
<text x="1040" y="288" text-anchor="start" fill="#3ddc97" font-size="9" font-weight="400">failed reload keeps A and the old config</text>
<text x="1040" y="306" text-anchor="start" fill="#93a0bd" font-size="9" font-weight="400">in-flight stream pins its generation</text>
<text x="1040" y="324" text-anchor="start" fill="#93a0bd" font-size="9" font-weight="400">plugin Close must be idempotent</text>
<text x="1040" y="348" text-anchor="start" fill="#66738f" font-size="8.5" font-weight="400">config watcher coalesces duplicate events</text>
<rect x="1020" y="396" width="380" height="230" rx="14" fill="rgba(247,185,85,.03)" stroke="rgba(247,185,85,.45)" stroke-width="1"/>
<text x="1040" y="422" text-anchor="start" fill="#e6ecf7" font-size="13" font-weight="600">deployment profiles</text>
<rect x="1040" y="436" width="340" height="76" rx="10" fill="#0b1020" stroke="rgba(61,220,151,.55)" stroke-width="1"/>
<text x="1056" y="458" text-anchor="start" fill="#3ddc97" font-size="11.5" font-weight="600">Same-Pod sidecar</text>
<text x="1056" y="476" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">127.0.0.1:50051 · h2c · no Service</text>
<text x="1056" y="492" text-anchor="start" fill="#66738f" font-size="8.5" font-weight="400">no ingress NetworkPolicy needed</text>
<rect x="1040" y="522" width="340" height="76" rx="10" fill="#0b1020" stroke="rgba(247,185,85,.55)" stroke-width="1"/>
<text x="1056" y="544" text-anchor="start" fill="#f7b955" font-size="11.5" font-weight="600">Cross-Pod Deployment</text>
<text x="1056" y="562" text-anchor="start" fill="#93a0bd" font-size="8.5" font-weight="400">Service :50051 · TLS/mTLS · NetworkPolicy</text>
<text x="1056" y="578" text-anchor="start" fill="#66738f" font-size="8.5" font-weight="400">PDB/HPA · certificate rotation</text>
<rect x="1020" y="638" width="380" height="188" rx="14" fill="#0b1020" stroke="rgba(120,150,220,.35)" stroke-width="1"/>
<text x="1040" y="664" text-anchor="start" fill="#e6ecf7" font-size="13" font-weight="600">operate &amp; observe</text>
<text x="1040" y="686" text-anchor="start" fill="#93a0bd" font-size="8.8" font-weight="400">GET /metrics · /healthz · /readyz</text>
<text x="1040" y="708" text-anchor="start" fill="#93a0bd" font-size="8.8" font-weight="400">plugin/stream metrics + Grafana dashboard</text>
<text x="1040" y="730" text-anchor="start" fill="#93a0bd" font-size="8.8" font-weight="400">Prometheus alerts: fail_open/closed, panic, latency</text>
<text x="1040" y="752" text-anchor="start" fill="#93a0bd" font-size="8.8" font-weight="400">TLS cert reload · W3C traceparent propagation</text>
<text x="1040" y="774" text-anchor="start" fill="#93a0bd" font-size="8.8" font-weight="400">CI: build · vet · race ×2 · e2e</text>
<line x1="40" y1="862" x2="1400" y2="862" stroke="rgba(120,150,220,.22)" stroke-width="1"/>
<text x="40" y="888" text-anchor="start" fill="#93a0bd" font-size="10.5" font-weight="400">One stream = one goroutine · one generation = immutable plugin instances · hot reload never restarts the process</text>
<text x="40" y="906" text-anchor="start" fill="#66738f" font-size="9.5" font-weight="400">Config errors keep the previous generation · plugin Close is idempotent · app/logger/server changes require a restart</text>
<text x="40" y="924" text-anchor="start" fill="#66738f" font-size="9" font-weight="400">docs/metrics.md · manifest/deploy/ · test/e2e/</text>
</svg>
