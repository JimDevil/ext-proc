<defs><linearGradient id="hl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgba(79,140,255,.16)"/><stop offset="1" stop-color="rgba(34,211,238,.07)"/></linearGradient></defs>
<rect x="0" y="0" width="1440" height="960" rx="16" fill="#0b1020"/>
<text x="40" y="48" text-anchor="start" fill="#e6ecf7" font-size="22" font-weight="700">ext-proc — Envoy external processing, production architecture</text>
<text x="40" y="72" text-anchor="start" fill="#93a0bd" font-size="11.5" font-weight="400">one stream per request · one goroutine per stream · six phases · immutable generations · explicit failure semantics</text>
<text x="40" y="112" text-anchor="start" fill="#93a0bd" font-size="13" font-weight="600">① Request path</text>
