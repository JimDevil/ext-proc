<text x="96" y="164" text-anchor="middle" fill="#e6ecf7" font-size="13.5" font-weight="600">Client</text>
<text x="96" y="182" text-anchor="middle" fill="#66738f" font-size="9.5" font-weight="400">curl / SDK</text>
<line x1="152" y1="169" x2="180" y2="169" stroke="#4f8cff" stroke-width="1.8" marker-end="url(#arrBlue)"/>
<rect x="184" y="126" width="216" height="254" rx="14" fill="rgba(79,140,255,.04)" stroke="rgba(79,140,255,.55)" stroke-width="1"/>
